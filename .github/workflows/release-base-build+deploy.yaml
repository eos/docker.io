on:
  push:
    branches:
      - 'master'
    paths:
      - 'release-base/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'release-base/**'

jobs:
  build:
    name: Build & deploy ``release-base`` images
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: x86_64,  runner: ubuntu-24.04     }
          - { platform: linux/arm64, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: eoshep/release-base
          tags: |
            type=raw,value={{date 'YYYY-MM-DD'}}-{{sha}}
            type=raw,value=latest
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          context: release-base/${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=eoshep/release-base,push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: eoshep/release-base
          tags: |
            type=raw,value={{date 'YYYY-MM-DD'}}-{{sha}}
            type=raw,value=latest
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'eoshep/release-base@sha256:%s ' *)
      -
        name: Inspect image
        run: |
          docker buildx imagetools inspect eoshep/release-base:${{ steps.meta.outputs.version }}
